name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  make-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore PLT cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: elixir/priv/plts
          key: plts-${{ runner.os }}-${{ hashFiles('elixir/mix.lock') }}

      # PR1 gate: `mix lint.baseline` (format/warnings/specs/credo).
      # `mix lint` (with strict dialyzer) is deferred until PR2 / Task 8
      # deletes the Linear-era carry-over modules that surface :underspecs
      # and :unmatched_returns warnings. See PLAN.md Step 4.5 (Outcome B-defer).
      - name: Lint baseline (format, warnings, specs, credo)
        run: |
          mix deps.get
          mix deps.compile
          mix lint.baseline

      - name: Test (strict, with coverage)
        run: mix test_strict
